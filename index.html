<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <!-- SEO & Branding Meta Tags -->
  <title>Ignova Global - Official Website</title>
  <meta name="description" content="Official website for Ignova Global. Publisher of high-quality mobile applications and interactive games.">
  <meta name="theme-color" content="#080911">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Dynamic Glowing Background -->
  <div class="ambient-container" aria-hidden="true">
    <div class="grid-overlay"></div>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Main Card Container -->
  <main class="page-wrapper">
    <div class="glass-card">
      
      <!-- Brand Logo / Emblem -->
      <div class="logo-wrapper">
        <div class="logo-glow"></div>
        <div class="logo-box">
          <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" />
                <stop offset="50%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#c084fc" />
              </linearGradient>
              <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366f1" />
                <stop offset="100%" stop-color="#d946ef" />
              </linearGradient>
            </defs>
            <!-- Modern Tech Emblem -->
            <path d="M24 6L38 14V34L24 42L10 34V14L24 6Z" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M24 13L32 18V28L24 33L16 28V18L24 13Z" fill="url(#glowGrad)" fill-opacity="0.35" stroke="url(#logoGradient)" stroke-width="1.8" />
            <circle cx="24" cy="23" r="3.5" fill="url(#logoGradient)" />
            <path d="M24 26.5V31" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" />
          </svg>
        </div>
      </div>

      <!-- Header & Content -->
      <h1 class="card-title">Welcome!</h1>
      <p class="card-description">
        This is the official website for <span class="highlight-brand">Ignova Global</span>.<br>
        We create useful apps and fun games.
      </p>

      <!-- Action Button -->
      <div class="btn-container">
        <a href="app-ads.txt" class="btn-ads" id="view-app-ads-btn">
          <span>View app-ads.txt</span>
          <svg class="btn-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4.16669 10H15.8334" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10.8334 5L15.8334 10L10.8334 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <!-- Footer & Verification Info -->
      <footer class="card-footer">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>Verified Publisher Domain</span>
        </div>
        <p class="copyright">&copy; 2026 Ignova Global. All rights reserved.</p>
      </footer>

    </div>
  </main>

</body>
</html>
